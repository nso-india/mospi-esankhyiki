openapi: 3.0.1

info:
  title: API for NSS-73 (Unincorporated Non-Agricultural Enterprises)
  description: >
    NSS 73rd round module APIs — indicator list, indicator-wise filters,
    paginated records, and Excel download. Endpoints return a JSON envelope
    with a boolean `statusCode` flag and a human-readable `msg`.
  version: 1.0.0

servers:
  - url: http://10.24.89.9:5000
    description: Development server

tags:
  - name: NSS-73
    description: Unincorporated Non-Agricultural Enterprises (NSS 73rd Round) APIs

paths:
  /api/nss-73/getNss73IndicatorList:
    get:
      tags:
        - NSS-73
      summary: Get indicator list
      description: >
        Returns the list of NSS-73 indicators. Each indicator carries its
        `viz` chart-type string (e.g. "hbar,vbar").
      responses:
        "200":
          description: Indicator list fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Indicator"
                  count:
                    type: integer
                    example: 6
                  msg:
                    type: string
                    example: Data fetched successfully
                  statusCode:
                    type: boolean
                    example: true
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/nss-73/getNss73FiltersByIndicatorCode:
    get:
      tags:
        - NSS-73
      summary: Get filters by indicator code
      description: >
        Returns the available dimension filter lists (state_ut, sector,
        broad_activity_category, enterprise_type, activity_category, etc.)
        for the given indicator. Each dimension is an array of
        { <dimension>_code, description } options. Dimensions not applicable
        to the indicator (e.g. `sub_indicator` for indicators without
        sub-indicators) are returned as empty arrays. Optional `sector_code`
        and `state_ut_code` narrow the option lists (e.g. activity categories)
        to those available for that sector/state.
      parameters:
        - $ref: "#/components/parameters/IndicatorCodeRequired"
        - in: query
          name: sector_code
          required: false
          description: Optional sector code (e.g. `1`) used to narrow the returned option lists.
          schema:
            type: integer
        - in: query
          name: state_ut_code
          required: false
          description: Optional state/UT code (e.g. `16`) used to narrow the returned option lists.
          schema:
            type: integer
      responses:
        "200":
          description: Filters fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >
                      Map of dimension name -> list of options. Keys vary by
                      indicator (e.g. `state_ut`, `sector`,
                      `broad_activity_category`, `enterprise_type`,
                      `activity_category`, `hired_workers`, `sub_indicator`).
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/FilterOption"
                  msg:
                    type: string
                    example: Data fetched successfully
                  statusCode:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/nss-73/getNss73Records:
    get:
      tags:
        - NSS-73
      summary: Get paginated NSS-73 records
      description: >
        Returns paginated NSS-73 data rows for the given indicator, optionally
        narrowed by any of the dimension filters returned by
        `getNss73FiltersByIndicatorCode`. Each dimension filter is passed as
        `<dimension>_code` and accepts comma-separated integer codes.
      parameters:
        - $ref: "#/components/parameters/IndicatorCodeRequired"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SubIndicatorCode"
        - $ref: "#/components/parameters/StateUtCode"
        - $ref: "#/components/parameters/SectorCode"
        - $ref: "#/components/parameters/BroadActivityCategoryCode"
        - $ref: "#/components/parameters/EnterpriseTypeCode"
        - $ref: "#/components/parameters/ActivityCategoryCode"
        - $ref: "#/components/parameters/HiredWorkersCode"
      responses:
        "200":
          description: >
            Data fetched successfully. When no rows match, `data` is an empty
            array and `meta_data` is omitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Nss73Record"
                  meta_data:
                    $ref: "#/components/schemas/MetaData"
                  msg:
                    type: string
                    example: Data fetched successfully
                  statusCode:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/nss-73/getNss73Download:
    get:
      tags:
        - NSS-73
      summary: Generate NSS-73 Excel download
      description: >
        Builds an XLSX file of the full (un-paginated) result set for the
        given indicator and optional dimension filters, then returns its
        relative path.
      parameters:
        - $ref: "#/components/parameters/IndicatorCodeRequired"
        - $ref: "#/components/parameters/SubIndicatorCode"
        - $ref: "#/components/parameters/StateUtCode"
        - $ref: "#/components/parameters/SectorCode"
        - $ref: "#/components/parameters/BroadActivityCategoryCode"
        - $ref: "#/components/parameters/EnterpriseTypeCode"
        - $ref: "#/components/parameters/ActivityCategoryCode"
        - $ref: "#/components/parameters/HiredWorkersCode"
      responses:
        "200":
          description: File ready for download.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_path:
                    type: string
                    description: Relative path to the generated XLSX file.
                    example: NSS73/nss73_4.xlsx
                  msg:
                    type: string
                    example: File ready for download
                  statusCode:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    IndicatorCodeRequired:
      in: query
      name: indicator_code
      required: true
      description: Indicator code (must exist in indicator table).
      schema:
        type: integer
        example: 6

    Page:
      in: query
      name: page
      required: false
      description: Page number (1-based). Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    Limit:
      in: query
      name: limit
      required: false
      description: >
        Records per page. Minimum 20 (values below 20 return an empty
        result). Defaults to 20.
      schema:
        type: integer
        minimum: 20
        default: 20
        example: 20

    SubIndicatorCode:
      in: query
      name: sub_indicator_code
      required: false
      description: >
        Comma-separated sub-indicator codes (e.g. `1`). Applicable only to
        indicators that have sub-indicators (e.g. Emolument per hired worker);
        passing it for other indicators returns 400 Invalid sub_indicator_code.
      schema:
        type: string

    StateUtCode:
      in: query
      name: state_ut_code
      required: false
      description: Comma-separated state/UT codes (e.g. `16,37`).
      schema:
        type: string

    SectorCode:
      in: query
      name: sector_code
      required: false
      description: Comma-separated sector codes (1 = Rural, 2 = Urban, 3 = Rural+Urban).
      schema:
        type: string

    BroadActivityCategoryCode:
      in: query
      name: broad_activity_category_code
      required: false
      description: Comma-separated broad activity category codes (e.g. `1`).
      schema:
        type: string

    EnterpriseTypeCode:
      in: query
      name: enterprise_type_code
      required: false
      description: Comma-separated enterprise type codes (e.g. `3`).
      schema:
        type: string

    ActivityCategoryCode:
      in: query
      name: activity_category_code
      required: false
      description: Comma-separated activity category codes (e.g. `10`).
      schema:
        type: string

    HiredWorkersCode:
      in: query
      name: hired_workers_code
      required: false
      description: Comma-separated hired-workers (formal/informal) codes (e.g. `3`).
      schema:
        type: string

  responses:
    BadRequest:
      description: Missing required parameter or invalid value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Missing required parameter: indicator_code"
            statusCode: false

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Internal server error
            statusCode: false

  schemas:
    Indicator:
      type: object
      properties:
        indicator_code:
          type: integer
          example: 6
        description:
          type: string
          example: GVA per Enterprise
        viz:
          type: string
          nullable: true
          description: Comma-separated visualization types.
          example: hbar,vbar

    FilterOption:
      type: object
      description: >
        A single dimension option. The code key is named after the dimension
        (e.g. `state_ut_code`, `sector_code`, `enterprise_type_code`).
      properties:
        description:
          type: string
          example: All-India
      additionalProperties: true

    MetaData:
      type: object
      properties:
        page:
          type: integer
          example: 1
        totalRecords:
          type: integer
          example: 1782
        totalPages:
          type: integer
          example: 90
        recordPerPage:
          type: integer
          example: 20

    Nss73Record:
      type: object
      description: >
        A data row. Dimension columns vary by indicator; only columns
        applicable to the indicator are present in the row (e.g.
        `sub_indicator` and `hired_workers` appear only for indicators that
        use them).
      properties:
        indicator:
          type: string
          example: GVA per Enterprise
        state_ut:
          type: string
          example: All-India
        sector:
          type: string
          example: Urban
        broad_activity_category:
          type: string
          example: Manufacturing
        enterprise_type:
          type: string
          example: All
        value:
          type: string
          nullable: true
          example: "216035"
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Missing required parameter: indicator_code"
        statusCode:
          type: boolean
          example: false
